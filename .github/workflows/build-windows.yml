name: Build Windows app

# Every push to the release branch builds a new Windows installer, runs the
# tests first, and publishes a GitHub release. Installed copies of VIDA Dental
# find that release through "Software updates".
on:
  push:
    branches:
      - claude/quirky-pasteur-v9tc47
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Test the clinic rules
        run: npm test

      - name: Set the version (major.minor from package.json, patch = build number)
        shell: bash
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building VIDA Dental $VERSION"

      - name: Build the installer and the portable app
        run: npx electron-builder --win --x64 --publish never

      - name: Check every file exists
        shell: bash
        run: |
          for f in "VIDA-Dental-Setup-$VERSION.exe" "VIDA-Dental-Setup-$VERSION.exe.blockmap" "VIDA-Dental-Portable-$VERSION.exe" "latest.yml"; do
            test -f "dist/$f" || { echo "Missing dist/$f"; exit 1; }
          done
          ls -la dist

      # One step creates the release with every file, so two uploads never
      # race each other. It stays a draft until every file is uploaded; a
      # dropped upload is retried up to 3 times.
      - name: Publish the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=("dist/VIDA-Dental-Setup-$VERSION.exe" "dist/VIDA-Dental-Setup-$VERSION.exe.blockmap" "dist/VIDA-Dental-Portable-$VERSION.exe" "dist/latest.yml")
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --draft --title "VIDA Dental $VERSION" --notes-file docs/RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
          for attempt in 1 2 3 4; do
            if gh release upload "v$VERSION" "${FILES[@]}" --clobber; then break; fi
            [ "$attempt" = 4 ] && { echo "Upload failed after 4 tries"; exit 1; }
            sleep $((attempt * 10))
          done
          # Publish only once every file is there, so laptops never see a half-uploaded release.
          gh release edit "v$VERSION" --draft=false --latest
          gh release view "v$VERSION" --json assets --jq '.assets[].name'

      - name: Keep the installers with this run
        uses: actions/upload-artifact@v4
        with:
          name: VIDA-Dental-${{ env.VERSION }}
          path: |
            dist/VIDA-Dental-Setup-*.exe
            dist/VIDA-Dental-Portable-*.exe
            dist/latest.yml
          retention-days: 30
